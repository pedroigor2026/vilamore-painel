<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://pedroigor2026.github.io https://*.supabase.co; connect-src 'self' https://*.supabase.co; frame-src https://www.youtube.com https://youtu.be; base-uri 'self'; object-src 'none'; form-action 'self'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vilamore · Dashboard</title>
<style>
  /* 30/10/2026: cores do MIM (mesmas variaveis do js/app.css do MIM) e olhinho na senha */
  :root{color-scheme:light dark;
    --berry:#1D6FB8;--berry-dark:#123C63;--berry-soft:#E4EFFB;
    --bg:#F5F4F7;--card:#FFFFFF;--ink:#241B20;--muted:#6A6072;--line:#E7E3EA;
    --ok:#2F7D46;--late:#C13438;--titulo:var(--berry-dark)}
  @media (prefers-color-scheme: dark){
    :root{--bg:#141217;--card:#1E1B23;--ink:#ECE8EF;--muted:#9A93A1;--line:#332F3A;
      --berry:#5AA7EA;--berry-soft:#17293E;--ok:#4CC386;--late:#E2696B;--titulo:var(--berry)}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:'Sora',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
  .card{background:var(--card);padding:32px 28px;border-radius:14px;width:min(92vw,400px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(18,60,99,.10)}
  h1{margin:0 0 2px;font-size:40px;font-weight:800;letter-spacing:.5px;color:var(--titulo);text-align:center}
  p.sub{margin:0 0 22px;color:var(--muted);font-size:12.5px;text-align:center}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 4px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:1rem}
  input:focus{outline:2px solid var(--berry);border-color:var(--berry)}
  button{width:100%;margin-top:20px;padding:12px 18px;border:0;border-radius:12px;background:var(--berry);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  button:active{background:var(--berry-dark)}
  button:disabled{opacity:.6;cursor:wait}
  .campo-senha{position:relative}
  .campo-senha input{padding-right:46px}
  .campo-senha .ver-senha{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;line-height:1;padding:0;margin:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:8px;cursor:pointer;font-size:17px;opacity:.65;color:var(--ink)}
  .campo-senha .ver-senha:hover{opacity:1;background:var(--berry-soft)}
  .campo-senha .ver-senha:focus-visible{outline:2px solid var(--berry);outline-offset:2px;opacity:1}
  .campo-senha .ver-senha[aria-pressed="true"]{opacity:1}
  .erro{margin-top:14px;color:var(--late);font-size:13px;min-height:1.1em;text-align:center}
  .erro.ok{color:var(--ok)}
  .load{text-align:center;color:var(--muted)}
  .lnk{margin-top:16px;text-align:center}
  .lnk a{color:var(--berry);font-size:13.5px;font-weight:600;text-decoration:none}
  .lnk a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Vilamore</h1>
  <p class="sub">Painel de vendas — acesso restrito</p>
  <form id="f" autocomplete="on">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <div class="campo-senha"><input id="senha" type="password" autocomplete="current-password" required><button type="button" class="ver-senha" data-ver-senha="senha" aria-label="Mostrar a senha" aria-pressed="false" title="Mostrar a senha">👁️</button></div>
    <button id="btn" type="submit">Entrar</button>
    <div class="erro" id="erro"></div>
    <div class="lnk"><a href="#" id="esqueci">Esqueci minha senha</a></div>
  </form>
</div>
<script>
// 30/10/2026 olhinho: mostra/esconde a senha digitada (vale tambem na tela de nova senha, criada depois)
document.addEventListener('click',function(ev){
  var b=ev.target.closest&&ev.target.closest('.ver-senha');if(!b)return;
  ev.preventDefault();
  var i=document.getElementById(b.getAttribute('data-ver-senha'));if(!i)return;
  var ver=i.type==='password';i.type=ver?'text':'password';
  b.setAttribute('aria-pressed',ver?'true':'false');
  var t=ver?'Esconder a senha':'Mostrar a senha';b.setAttribute('aria-label',t);b.title=t;b.textContent=ver?'🙈':'👁️';
  i.focus();
});
var SB_URL='https://imdypwtgqpgouwlhyfik.supabase.co';
var SB_ANON='sb_publishable_5EbpdievXaj7uw_Cdul2QQ_Mo77EgXg'; // forja:segredo-ok chave anon publica do Supabase protegida por RLS
var SESS_KEY='vg_dash_sess';

function getSess(){try{return JSON.parse(localStorage.getItem(SESS_KEY)||'null');}catch(e){return null;}}
function setSess(j){localStorage.setItem(SESS_KEY,JSON.stringify(j));}
function limpaSess(){localStorage.removeItem(SESS_KEY);}

function mostrarErro(t){document.getElementById('erro').textContent=t;document.getElementById('btn').disabled=false;}

async function buscarERenderizar(){
  var s=getSess();if(!s)return false;
  var r=await fetch(SB_URL+'/rest/v1/vg_dashboard_html?select=html&chave=eq.dashboard',{headers:{apikey:SB_ANON,Authorization:'Bearer '+s.access_token}});
  if(r.status===401){ if(await renovar()) return buscarERenderizar(); limpaSess(); return false; }
  if(!r.ok)return false;
  var rows=await r.json();
  if(!rows||!rows[0]||!rows[0].html){document.getElementById('card').innerHTML='<p class="load">Dashboard ainda não foi gerado hoje. Rode o gerador no PC e recarregue.</p>';return true;}
  var doc=rows[0].html;
  document.open();document.write(doc);document.close();
  return true;
}
async function renovar(){
  var s=getSess();if(!s||!s.refresh_token)return false;
  try{
    var r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok)return false;
    setSess(await r.json());return true;
  }catch(e){return false;}
}
async function entrar(email,senha){
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:senha})});
  var j=await r.json();
  if(!r.ok){mostrarErro(j.error_description||j.msg||('Falha no login ('+r.status+')'));return;}
  setSess(j);
  var ok=await buscarERenderizar();
  if(!ok)mostrarErro('Login OK, mas não consegui carregar o painel. Sua conta tem acesso de admin?');
}
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  document.getElementById('erro').textContent='';
  document.getElementById('btn').disabled=true;
  entrar(document.getElementById('email').value.trim(),document.getElementById('senha').value);
});

// ===== esqueci minha senha =====
function aviso(t,ok){var e=document.getElementById('erro');e.textContent=t;e.className='erro'+(ok?' ok':'');}
document.getElementById('esqueci').addEventListener('click',async function(ev){
  ev.preventDefault();
  var email=document.getElementById('email').value.trim();
  if(!email){aviso('Digite seu e-mail no campo acima e clique de novo.');return;}
  aviso('Enviando...',true);
  try{
    var r=await fetch(SB_URL+'/auth/v1/recover',{method:'POST',headers:{apikey:SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({email:email})});
    if(r.ok)aviso('Link de recuperação enviado para '+email+'. Confira a caixa de entrada (e o spam).',true);
    else{var j=await r.json();aviso(j.error_description||j.msg||('Não consegui enviar ('+r.status+'). Tente de novo em alguns minutos.'));}
  }catch(e){aviso('Sem conexão. Tente de novo.');}
});

// ===== volta do link do e-mail (redefinir senha) =====
function hashParams(){
  var p={},h=location.hash.replace(/^#/,'').split('&');
  for(var i=0;i<h.length;i++){var kv=h[i].split('=');if(kv[0])p[kv[0]]=decodeURIComponent(kv[1]||'');}
  return p;
}
var _hp=hashParams();
if(_hp.type==='recovery'&&_hp.access_token){
  document.getElementById('card').innerHTML=
    '<h1>Nova senha</h1><p class="sub">Crie a nova senha de acesso ao painel</p>'+
    '<form id="fr"><label for="ns1">Nova senha (mínimo 10 caracteres, use letras, números e símbolos)</label>'+
    '<div class="campo-senha"><input id="ns1" type="password" autocomplete="new-password" required><button type="button" class="ver-senha" data-ver-senha="ns1" aria-label="Mostrar a senha" aria-pressed="false" title="Mostrar a senha">👁️</button></div>'+
    '<label for="ns2">Repita a nova senha</label>'+
    '<div class="campo-senha"><input id="ns2" type="password" autocomplete="new-password" required><button type="button" class="ver-senha" data-ver-senha="ns2" aria-label="Mostrar a senha" aria-pressed="false" title="Mostrar a senha">👁️</button></div>'+
    '<button id="btnr" type="submit">Salvar nova senha</button>'+
    '<div class="erro" id="erro"></div></form>';
  document.getElementById('fr').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var s1=document.getElementById('ns1').value,s2=document.getElementById('ns2').value;
    if(s1.length<10){aviso('A senha precisa ter pelo menos 10 caracteres.');return;}
    if(s1!==s2){aviso('As duas senhas não conferem.');return;}
    document.getElementById('btnr').disabled=true;
    try{
      var r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SB_ANON,'Content-Type':'application/json',Authorization:'Bearer '+_hp.access_token},body:JSON.stringify({password:s1})});
      var j=await r.json();
      if(!r.ok){aviso(j.error_description||j.msg||('Falhou ('+r.status+'). Peça um link novo.'));document.getElementById('btnr').disabled=false;return;}
      setSess({access_token:_hp.access_token,refresh_token:_hp.refresh_token});
      history.replaceState(null,'',location.pathname);
      aviso('Senha alterada! Abrindo o painel...',true);
      var ok=await buscarERenderizar();
      if(!ok)location.reload();
    }catch(e){aviso('Sem conexão. Tente de novo.');document.getElementById('btnr').disabled=false;}
  });
}else{
  // já logado? tenta abrir direto
  if(getSess())buscarERenderizar().then(function(ok){if(!ok)document.getElementById('btn').disabled=false;});
}
</script>
</body>
</html>
