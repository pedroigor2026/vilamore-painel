<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alerta — Escala Vilamore</title>
<link rel="manifest" href="/vilamore-painel/alerta/manifest.json">
<style>html{font-size:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0,#0f1117);color:var(--t0,#e2e8f0);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:0}
.logo{width:72px;height:72px;border-radius:16px;margin-bottom:12px}
.title{font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:4px}
.sub{font-size:1.02rem;color:var(--t2,#b3bdcc);margin-bottom:20px}
.card{background:var(--s1,#1a1f2e);border-radius:16px;padding:22px;width:100%;max-width:380px;margin-bottom:16px;border:2px solid var(--s2,#2d3748);transition:.4s}
.card-ok{border-color:#48bb78!important;background:#0f2a1a!important}
.card-alert{border-color:#e53e3e!important;background:#2a0f0f!important;animation:pulse 1.5s ease-in-out infinite}
.card-warn{border-color:#d69e2e!important;background:#2a1f0a!important}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,.5)}50%{box-shadow:0 0 0 16px rgba(229,62,62,0)}}
.ico{font-size:3.2rem;margin-bottom:10px;display:block}
.txt{font-size:1.05rem;font-weight:800;margin-bottom:5px}
.stxt{font-size:1rem;color:var(--t1,#cbd5e0)}
.btn{display:block;width:100%;max-width:380px;padding:14px;border-radius:12px;font-size:1.05rem;font-weight:800;cursor:pointer;border:none;margin-bottom:10px;text-decoration:none;text-align:center;transition:.15s}
.btn-green{background:#48bb78;color:#000}
.btn-red{background:#e53e3e;color:#fff}
.btn-dark{background:var(--s2,#2d3748);color:var(--t1,#cbd5e0)}
.next{font-size:1.06rem;color:var(--t3,#9aa8bc);margin-top:4px;margin-bottom:12px}
.nbadge{display:inline-block;background:var(--s1,#1a1f2e);border:1px solid var(--s2,#2d3748);border-radius:20px;padding:5px 14px;font-size:1.06rem;color:var(--t2,#b3bdcc);margin-bottom:10px}
</style>
</head>
<body>
<img src="/vilamore-painel/icon.png" onerror="this.style.display='none'" class="logo" alt="Vilamore" onerror="this.src='https://pedroigor2026.github.io/icon.png'">
<div class="title">⏰ Alerta de Escala</div>
<div class="sub">Vilamore · Responsável do Dia</div>

<div id="card" class="card">
  <span class="ico" id="ico">⏳</span>
  <div class="txt" id="txt">Verificando...</div>
  <div class="stxt" id="stxt">Aguarde</div>
</div>

<a href="/vilamore-painel/" class="btn btn-green" id="btnApp" style="display:none">📅 Abrir App e Preencher Escala</a>
<button onclick="dismiss()" class="btn btn-dark" id="btnDismiss" style="display:none">🔕 Silenciar por 1 hora</button>
<div class="next" id="nextTxt"></div>

<div class="nbadge" id="nBadge">🔔 Notificações: verificando...</div>
<button onclick="ativarNotif()" class="btn btn-dark" id="btnNotif" style="max-width:380px;display:none">Ativar Notificações ▶</button>

<script src="/vilamore-painel/assets/app-alerta.js?v=dee0addf"></script>
</body>
</html>
